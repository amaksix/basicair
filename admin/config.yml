local_backend: true

backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

i18n:
  structure: multiple_folders
  locales: [lv, en, ru]
  default_locale: lv

locale_names:
  lv: Latviešu
  en: English
  ru: Русский

collections:
  - name: settings
    label: Site Settings
    files:
      - label: General Settings (Latviešu)
        name: settings-lv
        file: content/lv/settings.json
        fields: &settings_fields
          - { label: Site Name, name: site_name, widget: string }
          - { label: Site Tagline, name: site_tagline, widget: string, required: false }
          - label: Top Bar Announcements
            name: topbar_announcements
            widget: list
            fields:
              - { label: Text, name: text, widget: string }
              - { label: Highlight, name: highlight, widget: string, required: false }
          - label: Navigation
            name: navigation
            widget: object
            fields:
              - { label: Home, name: home, widget: string }
              - { label: Products, name: products, widget: string }
              - { label: Industries, name: industries, widget: string }
              - { label: Services, name: services, widget: string }
              - { label: News, name: news, widget: string }
              - { label: Contact, name: contact, widget: string }
              - label: Products Dropdown
                name: product_menu
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }
              - label: Industries Dropdown
                name: industry_menu
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }
              - label: Services Dropdown
                name: service_menu
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }
          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Phone, name: phone, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Address, name: address, widget: text }
              - { label: Copyright, name: copyright, widget: string }
              - { label: Newsletter Heading, name: newsletter_heading, widget: string }
              - { label: Newsletter Placeholder, name: newsletter_placeholder, widget: string }
              - { label: Subscribe Button, name: subscribe_button, widget: string }
              - label: Information Links
                name: info_links
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }
              - label: Customer Service Links
                name: service_links
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }
          - label: Social Links
            name: social
            widget: object
            fields:
              - { label: Facebook URL, name: facebook, widget: string, required: false }
              - { label: X (Twitter) URL, name: twitter, widget: string, required: false }
              - { label: Instagram URL, name: instagram, widget: string, required: false }
              - { label: Telegram URL, name: telegram, widget: string, required: false }
          - label: UI Labels
            name: labels
            widget: object
            fields:
              - { label: Request Quote, name: request_quote, widget: string }
              - { label: Quick View, name: quick_view, widget: string }
              - { label: Explore Collection, name: explore_collection, widget: string }
              - { label: View All Categories, name: view_all_categories, widget: string }
              - { label: Products / Shop label, name: shop, widget: string }
              - { label: Search, name: search, widget: string }
              - { label: Need Help, name: need_help, widget: string }
              - { label: Send Message, name: send_message, widget: string }
      - label: General Settings (English)
        name: settings-en
        file: content/en/settings.json
        fields: *settings_fields
      - label: General Settings (Русский)
        name: settings-ru
        file: content/ru/settings.json
        fields: *settings_fields

  - name: home_page
    label: Home Page
    files:
      - label: Home Page (Latviešu)
        name: home-lv
        file: content/lv/pages/home.json
        fields: &home_fields
          - { label: Page Title, name: title, widget: string }
          - label: Hero Slides
            name: hero_slides
            widget: list
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Subheading, name: subheading, widget: text }
              - { label: Button Text, name: button_text, widget: string }
              - { label: Button URL, name: button_url, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Slide Class, name: slide_class, widget: string, default: "slide-1", required: false }
          - label: Categories
            name: categories
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Link, name: url, widget: string }
          - label: Vision Section
            name: vision
            widget: object
            required: false
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
              - label: Sectors
                name: sectors
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Icon, name: image, widget: image }
          - label: Featured Products Section
            name: featured_section
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Subheading, name: subheading, widget: string }
          - label: Gallery
            name: gallery
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Subheading, name: subheading, widget: string, required: false }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Alt Text, name: alt, widget: string, required: false }
                  - { label: Link URL, name: url, widget: string, required: false }
          - label: Partners
            name: partners
            widget: object
            required: false
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Logos
                name: logos
                widget: list
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Alt Text, name: alt, widget: string }
      - label: Home Page (English)
        name: home-en
        file: content/en/pages/home.json
        fields: *home_fields
      - label: Home Page (Русский)
        name: home-ru
        file: content/ru/pages/home.json
        fields: *home_fields

  - name: services_page
    label: Services Page
    files:
      - label: Services Page (Latviešu)
        name: services-lv
        file: content/lv/pages/services.json
        fields: &services_fields
          - { label: Page Title, name: title, widget: string }
          - { label: Breadcrumb Home, name: breadcrumb_home, widget: string }
          - { label: Breadcrumb Current, name: breadcrumb_current, widget: string }
          - { label: Hero Title, name: hero_title, widget: string }
          - { label: Hero Background, name: hero_image, widget: image }
          - { label: Main Heading, name: main_heading, widget: string }
          - { label: Main Intro, name: main_intro, widget: text }
          - { label: Learn More Label, name: learn_more, widget: string }
      - label: Services Page (English)
        name: services-en
        file: content/en/pages/services.json
        fields: *services_fields
      - label: Services Page (Русский)
        name: services-ru
        file: content/ru/pages/services.json
        fields: *services_fields

  - name: service_items
    label: Services
    label_singular: Service
    i18n: true
    folder: "content/{{locale}}/services"
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string, hint: "Short name for nav, breadcrumb and listing cards" }
      - { label: Heading, name: heading, widget: string, required: false, hint: "Optional page H1; falls back to Title" }
      - { label: Slug, name: slug, widget: string, hint: "Used in URL, e.g. projektesana" }
      - { label: Sort Order, name: order, widget: number, default: 0, required: false }
      - { label: Summary, name: summary, widget: text, hint: "Short text on the services listing page" }
      - { label: Card Image, name: image, widget: image }
      - { label: Hero Image, name: hero_image, widget: image }
      - label: Paragraphs
        name: paragraphs
        widget: list
        field: { label: Paragraph, name: paragraph, widget: text }
      - { label: Bullets Intro, name: bullets_intro, widget: text, required: false }
      - label: Bullets
        name: bullets
        widget: list
        required: false
        field: { label: Item, name: item, widget: string }
      - label: Closing Paragraphs
        name: closing_paragraphs
        widget: list
        required: false
        field: { label: Paragraph, name: paragraph, widget: text }
      - { label: CTA Button Text, name: cta_text, widget: string }

  - name: contact_page
    label: Contact Page
    files:
      - label: Contact Page (Latviešu)
        name: contact-lv
        file: content/lv/pages/contact.json
        fields: &contact_fields
          - { label: Page Title, name: title, widget: string }
          - { label: Breadcrumb Home, name: breadcrumb_home, widget: string }
          - { label: Breadcrumb Current, name: breadcrumb_current, widget: string }
          - { label: Hero Title, name: hero_title, widget: string }
          - { label: Hero Image, name: hero_image, widget: image }
          - { label: Form Heading, name: form_heading, widget: string }
          - { label: Form Intro, name: form_intro, widget: text }
          - label: Form Labels
            name: form_labels
            widget: object
            fields:
              - { label: Legal Entity, name: legal_entity, widget: string }
              - { label: Legal Entity Hint, name: legal_entity_hint, widget: string }
              - { label: Company Name, name: company_name, widget: string }
              - { label: Reg Number, name: reg_number, widget: string }
              - { label: VAT Number, name: vat_number, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Name Hint, name: name_hint, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Email Hint, name: email_hint, widget: string }
              - { label: Message, name: message, widget: string }
              - { label: Message Placeholder, name: message_placeholder, widget: string }
              - { label: Submit Button, name: submit, widget: string }
          - label: Contact Info
            name: contact_info
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Email Label, name: email_label, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Phone Label, name: phone_label, widget: string }
              - { label: Phone, name: phone, widget: string }
          - label: Company
            name: company
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Reg Number Label, name: reg_number_label, widget: string }
              - { label: Reg Number, name: reg_number, widget: string }
              - { label: VAT Number Label, name: vat_number_label, widget: string }
              - { label: VAT Number, name: vat_number, widget: string }
          - label: Legal Address
            name: legal_address
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Address, name: address, widget: text }
          - label: Office
            name: office
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Address, name: address, widget: text }
          - label: Bank
            name: bank
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: SWIFT Label, name: swift_label, widget: string }
              - { label: SWIFT, name: swift, widget: string }
              - { label: Account Label, name: account_label, widget: string }
              - { label: Account, name: account, widget: string }
      - label: Contact Page (English)
        name: contact-en
        file: content/en/pages/contact.json
        fields: *contact_fields
      - label: Contact Page (Русский)
        name: contact-ru
        file: content/ru/pages/contact.json
        fields: *contact_fields

  - name: shop_page
    label: Shop Page
    files:
      - label: Shop Page (Latviešu)
        name: shop-lv
        file: content/lv/pages/shop.json
        fields: &shop_fields
          - { label: Page Title, name: title, widget: string }
          - { label: Breadcrumb Home, name: breadcrumb_home, widget: string }
          - { label: Breadcrumb Current, name: breadcrumb_current, widget: string }
          - { label: Page Heading, name: heading, widget: string }
          - { label: Page Description, name: description, widget: text, required: false }
      - label: Shop Page (English)
        name: shop-en
        file: content/en/pages/shop.json
        fields: *shop_fields
      - label: Shop Page (Русский)
        name: shop-ru
        file: content/ru/pages/shop.json
        fields: *shop_fields

  - name: product_categories
    label: Product Categories
    label_singular: Product Category
    i18n: true
    folder: "content/{{locale}}/product-categories"
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Used in URL, e.g. gaisa-filtri" }
      - { label: Sort Order, name: order, widget: number, default: 0, required: false }
      - { label: Summary, name: summary, widget: text }
      - { label: Hero Image, name: hero_image, widget: image }
      - label: Paragraphs
        name: paragraphs
        widget: list
        field: { label: Paragraph, name: paragraph, widget: text }
      - { label: CTA Button Text, name: cta_text, widget: string }
      - { label: Coming Soon Note, name: coming_soon, widget: string, required: false }

  - name: industries_page
    label: Industries Page
    files:
      - label: Industries Page (Latviešu)
        name: industries-lv
        file: content/lv/pages/industries.json
        fields: &industries_fields
          - { label: Page Title, name: title, widget: string }
          - { label: Breadcrumb Home, name: breadcrumb_home, widget: string }
          - { label: Breadcrumb Current, name: breadcrumb_current, widget: string }
          - { label: Hero Title, name: hero_title, widget: string }
          - { label: Hero Background, name: hero_image, widget: image }
          - { label: Main Heading, name: main_heading, widget: string }
          - { label: Main Intro, name: main_intro, widget: text }
          - { label: Articles Label, name: articles_label, widget: string }
          - { label: Articles Summary, name: articles_summary, widget: text }
      - label: Industries Page (English)
        name: industries-en
        file: content/en/pages/industries.json
        fields: *industries_fields
      - label: Industries Page (Русский)
        name: industries-ru
        file: content/ru/pages/industries.json
        fields: *industries_fields

  - name: articles_page
    label: Articles Page
    files:
      - label: Articles Page (Latviešu)
        name: articles-lv
        file: content/lv/pages/articles.json
        fields: &articles_fields
          - { label: Page Title, name: title, widget: string }
          - { label: Breadcrumb Home, name: breadcrumb_home, widget: string }
          - { label: Breadcrumb Industries, name: breadcrumb_industries, widget: string }
          - { label: Breadcrumb Current, name: breadcrumb_current, widget: string }
          - { label: Hero Title, name: hero_title, widget: string }
          - { label: Hero Background, name: hero_image, widget: image }
          - { label: Main Heading, name: main_heading, widget: string }
          - { label: Main Intro, name: main_intro, widget: text }
          - { label: Empty State, name: empty_state, widget: text }
      - label: Articles Page (English)
        name: articles-en
        file: content/en/pages/articles.json
        fields: *articles_fields
      - label: Articles Page (Русский)
        name: articles-ru
        file: content/ru/pages/articles.json
        fields: *articles_fields

  - name: news_page
    label: News Page
    files:
      - label: News Page (Latviešu)
        name: news-lv
        file: content/lv/pages/news.json
        fields: &news_fields
          - { label: Page Title, name: title, widget: string }
          - { label: Breadcrumb Home, name: breadcrumb_home, widget: string }
          - { label: Breadcrumb Current, name: breadcrumb_current, widget: string }
          - { label: Hero Title, name: hero_title, widget: string }
          - { label: Hero Background, name: hero_image, widget: image }
          - { label: Main Heading, name: main_heading, widget: string }
          - { label: Main Intro, name: main_intro, widget: text }
          - { label: Empty State, name: empty_state, widget: text }
      - label: News Page (English)
        name: news-en
        file: content/en/pages/news.json
        fields: *news_fields
      - label: News Page (Русский)
        name: news-ru
        file: content/ru/pages/news.json
        fields: *news_fields

  - name: products
    label: Products
    label_singular: Product
    i18n: true
    folder: "content/{{locale}}/products"
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Used in URL, e.g. air-conditioner-pro" }
      - { label: Short Description, name: description, widget: text, required: false }
      - { label: Full Description, name: body, widget: markdown, required: false }
      - { label: Main Image, name: image, widget: image }
      - { label: Hover Image, name: image_hover, widget: image, required: false }
      - { label: Featured on Homepage, name: featured, widget: boolean, default: false }
      - { label: Sort Order, name: order, widget: number, default: 0, required: false }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        fields:
          - { label: Image, name: image, widget: image }
